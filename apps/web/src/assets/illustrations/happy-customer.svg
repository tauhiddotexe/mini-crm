<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Background Glow & Platform -->
  <ellipse cx="400" cy="510" rx="340" ry="40" fill="#F1F5F9" />
  <ellipse cx="400" cy="510" rx="260" ry="25" fill="#E2E8F0" />
  
  <!-- Desk Base -->
  <path d="M160 460H640V475C640 483.284 633.284 490 625 490H175C166.716 490 160 483.284 160 475V460Z" fill="#1E293B" />
  <rect x="180" y="475" width="20" height="40" rx="4" fill="#334155" />
  <rect x="600" y="475" width="20" height="40" rx="4" fill="#334155" />

  <!-- Laptop / CRM Terminal -->
  <rect x="320" y="360" width="160" height="100" rx="8" fill="#0F172A" />
  <rect x="330" y="370" width="140" height="80" rx="4" fill="#1E293B" />
  <!-- Screen content: CRM Dashboard bars -->
  <rect x="340" y="380" width="40" height="8" rx="2" fill="#3B82F6" />
  <rect x="340" y="394" width="70" height="6" rx="2" fill="#0D9488" />
  <rect x="340" y="406" width="55" height="6" rx="2" fill="#64748B" />
  <rect x="420" y="380" width="40" height="32" rx="4" fill="#334155" />
  <circle cx="440" cy="396" r="10" fill="#3B82F6" opacity="0.4" />
  <!-- Keyboard Base -->
  <path d="M290 460H510L500 470H300L290 460Z" fill="#64748B" />

  <!-- Floating Customer Support UI Card (Left) -->
  <g transform="translate(110, 180)">
    <rect width="180" height="130" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <circle cx="36" cy="36" r="16" fill="#0D9488" />
    <!-- User Avatar Icon inside circle -->
    <circle cx="36" cy="32" r="6" fill="#FFFFFF" />
    <path d="M26 44C26 39.5817 29.5817 36 34 36H38C42.4183 36 46 39.5817 46 44V46H26V44Z" fill="#FFFFFF" />
    <!-- Status lines -->
    <rect x="64" y="26" width="80" height="8" rx="4" fill="#0F172A" />
    <rect x="64" y="40" width="50" height="6" rx="3" fill="#0D9488" />
    <!-- Active Ticket Badge -->
    <rect x="20" y="68" width="140" height="42" rx="10" fill="#F0FDFA" border="1px solid #CCFBF1" />
    <circle cx="38" cy="89" r="6" fill="#10B981" />
    <rect x="52" y="82" width="70" height="6" rx="3" fill="#0F172A" />
    <rect x="52" y="92" width="45" height="5" rx="2.5" fill="#64748B" />
  </g>

  <!-- Floating CRM Insights Card (Right) -->
  <g transform="translate(510, 160)">
    <rect width="190" height="140" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <rect x="20" y="20" width="90" height="10" rx="5" fill="#0F172A" />
    <!-- Mini Bar Chart -->
    <rect x="20" y="85" width="16" height="35" rx="4" fill="#3B82F6" opacity="0.3" />
    <rect x="44" y="65" width="16" height="55" rx="4" fill="#3B82F6" opacity="0.6" />
    <rect x="68" y="45" width="16" height="75" rx="4" fill="#3B82F6" />
    <rect x="92" y="75" width="16" height="45" rx="4" fill="#0D9488" opacity="0.5" />
    <rect x="116" y="55" width="16" height="65" rx="4" fill="#0D9488" />
    <!-- 5 Star Rating Floating Capsule -->
    <rect x="120" y="15" width="55" height="22" rx="11" fill="#FEF3C7" />
    <path d="M135 26L136.5 22.5L140 22L137.5 19.5L138 16L135 17.5L132 16L132.5 19.5L130 22L133.5 22.5L135 26Z" fill="#F59E0B" />
    <text x="144" y="30" font-family="sans-serif" font-size="10" font-weight="bold" fill="#D97706">5.0</text>
  </g>

  <!-- Support Rep / Character (Center) -->
  <!-- Body/Torso -->
  <path d="M340 360C340 315.817 366.863 280 400 280C433.137 280 460 315.817 460 360V400H340V360Z" fill="#3B82F6" />
  <!-- Shirt Collar / Necktie -->
  <path d="M388 280L400 305L412 280H388Z" fill="#FFFFFF" />
  <path d="M396 300L400 340L404 300Z" fill="#0F172A" />
  
  <!-- Neck -->
  <rect x="388" y="255" width="24" height="30" fill="#FDBA74" />
  
  <!-- Head -->
  <ellipse cx="400" cy="225" rx="32" ry="38" fill="#FDBA74" />

  <!-- Hair -->
  <path d="M366 220C366 185 380 175 400 175C420 175 434 185 434 220C434 225 432 230 432 230C425 200 415 190 400 190C385 190 375 200 368 230C368 230 366 225 366 220Z" fill="#1E293B" />

  <!-- Headset -->
  <path d="M362 220C362 195 378 182 400 182C422 182 438 195 438 220" stroke="#0F172A" stroke-width="4" stroke-linecap="round" fill="none" />
  <rect x="358" y="212" width="10" height="20" rx="5" fill="#0D9488" />
  <rect x="432" y="212" width="10" height="20" rx="5" fill="#0D9488" />
  <!-- Mic Extension -->
  <path d="M362 226H378L384 236" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none" />
  <circle cx="386" cy="237" r="3" fill="#3B82F6" />

  <!-- Face Details -->
  <!-- Eyes (Happy Arcs) -->
  <path d="M386 222C388 219 392 219 394 222" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M406 222C408 219 412 219 414 222" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <!-- Smile -->
  <path d="M392 238C396 244 404 244 408 238" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Welcome Banner / Speech Bubble Above -->
  <g transform="translate(310, 80)">
    <rect width="180" height="60" rx="20" fill="#0F172A" />
    <path d="M400 140L390 152L410 140Z" fill="#0F172A" />
    <text x="90" y="36" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Welcome to CRM</text>
  </g>

  <!-- Decorative Sparkles -->
  <path d="M140 120L143 128L151 131L143 134L140 142L137 134L129 131L137 128Z" fill="#F59E0B" />
  <path d="M680 340L682 346L688 348L682 350L680 356L678 350L672 348L678 346Z" fill="#3B82F6" />
  <circle cx="690" cy="110" r="6" fill="#0D9488" opacity="0.6" />
  <circle cx="120" cy="380" r="8" fill="#3B82F6" opacity="0.4" />
</svg>