<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Background Glow & Base Platform -->
  <ellipse cx="400" cy="510" rx="320" ry="38" fill="#F1F5F9" />
  <ellipse cx="400" cy="510" rx="240" ry="24" fill="#E2E8F0" />

  <!-- Empty Inbox Tray Base -->
  <g transform="translate(240, 310)">
    <!-- Back wall of tray -->
    <path d="M20 60L70 10H250L300 60V140C300 151.046 291.046 160 280 160H40C28.9543 160 20 151.046 20 140V60Z" fill="#CBD5E1" />
    <!-- Inner floor shadow -->
    <path d="M40 70H280V130H40V70Z" fill="#94A3B8" />
    <!-- Front Tray Wall (Lower cut-out for inbox tray) -->
    <path d="M0 80L50 140H270L320 80V150C320 166.569 306.569 180 290 180H30C13.4315 180 0 166.569 0 150V80Z" fill="#1E293B" />
    <path d="M50 140H270V150C270 155.523 265.523 160 260 160H60C54.4772 160 50 155.523 50 150V140Z" fill="#0F172A" />
    <!-- Label on Tray -->
    <rect x="110" y="110" width="100" height="24" rx="6" fill="#3B82F6" />
    <text x="160" y="126" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">TICKETS INBOX</text>
  </g>

  <!-- Large Floating All Clear Ticket / Card -->
  <g transform="translate(250, 110)">
    <!-- Card Shadow -->
    <rect x="10" y="10" width="300" height="190" rx="20" fill="#0F172A" opacity="0.06" />
    <!-- Main Card -->
    <rect width="300" height="190" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    
    <!-- Top Bar of Card -->
    <rect width="300" height="12" rx="6" fill="#3B82F6" />

    <!-- Card Header / Title Lines -->
    <circle cx="50" cy="55" r="18" fill="#F0FDFA" />
    <path d="M42 55L48 61L58 49" stroke="#0D9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="80" y="44" width="120" height="10" rx="5" fill="#0F172A" />
    <rect x="80" y="60" width="70" height="8" rx="4" fill="#0D9488" />

    <line x1="30" y1="92" x2="270" y2="92" stroke="#F1F5F9" stroke-width="2" stroke-dasharray="6 6" />

    <!-- Content Mock Skeleton -->
    <rect x="30" y="112" width="180" height="8" rx="4" fill="#E2E8F0" />
    <rect x="30" y="128" width="140" height="8" rx="4" fill="#F1F5F9" />
    <rect x="30" y="144" width="90" height="8" rx="4" fill="#F1F5F9" />

    <!-- Big Green Check Badge on Top Right of Card -->
    <g transform="translate(225, 115)">
      <circle cx="28" cy="28" r="28" fill="#10B981" />
      <circle cx="28" cy="28" r="34" stroke="#10B981" stroke-width="2" stroke-opacity="0.2" fill="none" />
      <path d="M18 28L25 35L38 21" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Secondary Floating Envelope / Support Icon (Left) -->
  <g transform="translate(130, 200)">
    <rect width="110" height="80" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    <!-- Envelope Flap -->
    <path d="M4 8L55 46L106 8" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Sparkle Badge -->
    <circle cx="92" cy="18" r="12" fill="#3B82F6" />
    <text x="92" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">0</text>
  </g>

  <!-- Floating Customer Support Speech Bubble (Right) -->
  <g transform="translate(540, 230)">
    <rect width="140" height="75" rx="16" fill="#0F172A" />
    <path d="M540 280L525 292L545 290Z" fill="#0F172A" />
    <text x="70" y="34" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">All Caught Up!</text>
    <text x="70" y="54" font-family="sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">No pending tickets</text>
  </g>

  <!-- Floating Decorative Icons & Stars -->
  <!-- Checkmark shield (Top Center) -->
  <g transform="translate(380, 40)">
    <circle cx="20" cy="20" r="20" fill="#EFF6FF" />
    <path d="M13 20L18 25L27 15" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <path d="M180 120L183 128L191 131L183 134L180 142L177 134L169 131L177 128Z" fill="#F59E0B" />
  <path d="M640 130L642 136L648 138L642 140L640 146L638 140L632 138L638 136Z" fill="#0D9488" />
  <circle cx="680" cy="380" r="6" fill="#3B82F6" opacity="0.5" />
  <circle cx="160" cy="420" r="8" fill="#0D9488" opacity="0.3" />
</svg>